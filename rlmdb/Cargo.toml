[package]
name = "rlmdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A Rust rewrite of LMDB 0.9, binary compatible with the C library's data and lock files"

[lib]
name = "rlmdb"
path = "src/lib.rs"

[dependencies]
libc.workspace = true
bitflags = "2"

# The Windows system calls of `os/windows.rs` (file mappings, LockFileEx,
# named mutexes); not used anywhere else.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    # NtCreateSection & co.: LMDB 1.0's growing data-file map.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_Memory",
] }

[dev-dependencies]
tempfile = "3"
# The tests build the C library and tools; with the MSVC toolchain they
# find `cl.exe` and `lib.exe` through it (`tests/common`).
cc = "1"
