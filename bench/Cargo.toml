[package]
name = "rlmdb-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Benchmarks of the Rust LMDB rewrite against the C library (identical workloads, side by side)"

# The driver and the Rust side of every workload. The C side is the
# `cbench` program built by build.rs from c/cbench.c and the C library.
[[bin]]
name = "rlmdb-bench"
path = "src/main.rs"

[dependencies]
rlmdb = { path = "../rlmdb" }

[build-dependencies]
cc = "1"
