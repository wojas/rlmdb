[package]
name = "rlmdb-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The LMDB C API over the Rust LMDB implementation: the code of librlmdb and the liblmdb stubs"
publish = false

# The implementation, an rlib. The libraries C programs link are built by
# the packages in artifacts/ (librlmdb, lmdb09-stub, lmdb10-stub), which
# depend on this one and add what differs between them (src/profile.rs).

[dependencies]
rlmdb = { path = "../rlmdb" }
libc.workspace = true

# GetSystemInfo (the OS page size) on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
cc = "1"
# Not used as Rust crates: depending on them makes cargo build the three
# libraries (static and shared) before this package's integration tests,
# which link C programs against them or load them.
librlmdb = { path = "artifacts/rlmdb" }
lmdb09-stub = { path = "artifacts/lmdb09" }
lmdb10-stub = { path = "artifacts/lmdb10" }
