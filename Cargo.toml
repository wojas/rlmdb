[workspace]
resolver = "2"
members = [
    "rlmdb",
    "rlmdb-capi",
    "rlmdb-capi/artifacts/rlmdb",
    "rlmdb-capi/artifacts/lmdb09",
    "rlmdb-capi/artifacts/lmdb10",
    "rlmdb-tools",
    "interop",
    "bench",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "OLDAP-2.8"
repository = "https://github.com/wojas/rlmdb"

[workspace.dependencies]
libc = "0.2"

# The tests run the dev profile. Optimised a little (rlmdb, the C API, the
# Rust peer and tools the tests start, the tests' own models), the test
# suite takes two thirds of the time it takes unoptimised; the C oracle is
# built with -O2 regardless.
# Debug assertions and overflow checks stay on: the robustness tests find
# an integer overflow on crafted input because it panics here (AGENTS.md
# section 3).
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
