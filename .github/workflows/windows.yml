# Windows x86-64: lints and rustdoc with both Rust toolchains, the tests
# with MSVC's, the primary one: the platform suite (RLMDB_TEST_SCOPE=
# platform, see interop/README.md; nightly.yml runs the whole suite on
# Windows, and ci.yml on Linux x86-64). With MinGW-w64's only what
# depends on the compilers: that everything compiles (clippy, rustdoc), that
# the three C libraries build, and that C programs compile, link and run
# against them (the rlmdb-capi tests, the install test included); the
# rlmdb, rlmdb-tools, interop and bench tests do not run there, as the
# compilers are not expected to make a difference to them. The tests build
# the C reference library from tests/lmdb-c with the toolchain's C compiler:
# MSVC's cl (found by the cc crate in the runner's Visual Studio) or
# MinGW-w64's gcc from MSYS2. Formatting does not depend on the platform and
# is checked in ci.yml.
#
# The checkout keeps the repository's line endings (no core.autocrlf): the
# tests compare files and outputs byte for byte.
#
# RLMDB_DEFAULT_FORMAT, RLMDB_FEATURES and RLMDB_IGNORE_ENV are deliberately
# not set: the tests assume they are unset (see scripts/check-all.sh).
#
# The tests' environments go to the runner's local disk (TMP and TEMP set to
# runner.temp, on D: with the workspace) instead of the user's temp
# directory on C:, the network-backed OS disk. C LMDB's synced writes on
# Windows are written through (FILE_FLAG_WRITE_THROUGH), which is what the
# time of its writers is made of (a C 1.0 fill with 256-byte pages: 2.2 s
# synced, 0.16 s with MDB_NOSYNC, on a local SSD); with the temp directory
# on C:, C 1.0 writers with 256-byte pages ran past the 120 s command
# timeout of the interop scenarios. INTEROP_TIMEOUT_SECS gives slow runners
# a margin on top: even on D:, with the scenarios of all page sizes running
# in parallel on the runner's four cores, a C 1.0 fill or delete with
# 256-byte pages has taken over five minutes (a 300 s margin failed three
# runs out of four). A peer that hangs still fails the test, later. (The
# MinGW-w64 job runs no interop scenarios and needs no such margin.)
name: Windows

on:
  # Pushes to main and pull requests, not both for a branch with a pull
  # request (that ran every check twice). A branch without a pull request
  # runs nothing; start it by hand with workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msvc:
    name: Windows x86-64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: line endings as committed
        run: git config --global core.autocrlf false
      # Microsoft Defender scans every file the build and the tests write
      # and every program they start (each interop test binary starts
      # hundreds of peer processes, and C's write-through commits write
      # the tests' environments page by page): not in the workspace (the
      # build), the runner's temp directory (the tests' environments, and
      # MSYS2) and the toolchain.
      - name: no Defender scans of the build and the tests
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: test (platform suite)
        run: cargo test --workspace --no-fail-fast
        env:
          RLMDB_TEST_SCOPE: platform
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          INTEROP_TIMEOUT_SECS: "900"

  gnu:
    name: Windows x86-64 (GNU, MinGW-w64)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: line endings as committed
        run: git config --global core.autocrlf false
      # As in the MSVC job.
      - name: no Defender scans of the build and the tests
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}", "${{ runner.temp }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      # The C compiler (gcc, ar) for the cc crate and the tests, ahead of any
      # other MinGW on the runner's PATH.
      - name: MinGW-w64 on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
      - name: Rust (GNU toolchain)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy
          rustup default stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # librlmdb and the two liblmdb stubs (static and shared), which the
      # C programs of the next step link against.
      - name: C libraries
        run: cargo build -p librlmdb -p lmdb09-stub -p lmdb10-stub
      # C programs (the test programs, upstream's mtest*.c and tools, the
      # C peer) built with gcc against the libraries and run.
      - name: test (C API)
        run: cargo test -p rlmdb-capi --no-fail-fast
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
