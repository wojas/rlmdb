# Formatting, lints, rustdoc and the tests on every push and pull request,
# on the platforms rlmdb is tested on (Windows: windows.yml). The tests
# build the C reference library from tests/lmdb-c with the runner's C
# compiler; no git history or network access is needed after the checkout.
#
# Linux x86-64 runs the whole test suite. Linux arm64 and macOS run the
# platform suite (RLMDB_TEST_SCOPE=platform, see interop/README.md): what
# depends on the platform (unit and format tests, the lock file, readers
# and concurrency, the C API, tools and install tests, the differential
# tests at the OS page size, the reader and lock-file scenarios of the
# interop matrix and a smoke set of the others); the rest of the matrix,
# the other page sizes, the mutation and model tests are SKIPPED there.
# nightly.yml runs the whole suite on every platform.
#
# RLMDB_DEFAULT_FORMAT, RLMDB_FEATURES and RLMDB_IGNORE_ENV are deliberately
# not set: the tests assume they are unset (see scripts/check-all.sh).
name: CI

on:
  # Pushes to main and pull requests, not both for a branch with a pull
  # request (that ran every check twice). A branch without a pull request
  # runs nothing; start it by hand with workflow_dispatch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            scope: full
          - name: Linux arm64
            os: ubuntu-24.04-arm
            scope: platform
          - name: macOS arm64
            os: macos-latest
            scope: platform
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The tests' environments go to a file system in memory (a tmpfs, an
      # APFS RAM disk), RLMDB_TEST_SCRATCH: the tests and the C peers commit
      # synced, and on the runner's disk every commit waits for a flush (on
      # macOS a full one, F_FULLFSYNC). The targets of copies stay on the
      # disk, in target/tmp: they are written with O_DIRECT on Linux, which
      # only a disk file system checks (the test helpers say why, e.g.
      # rlmdb/tests/common/mod.rs, disk_tempdir). The size only caps the
      # contents: the whole suite on 4 cores had 1.4 GiB there at most, the
      # platform suite 0.9 GiB, the whole suite with macOS's 16 KiB pages
      # on 3 cores 1.3 GiB.
      - name: scratch in memory (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          sudo mount -t tmpfs -o size=3g,uid="$(id -u)",gid="$(id -g)",mode=0755 tmpfs "$RUNNER_TEMP/scratch"
          echo "RLMDB_TEST_SCRATCH=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
      - name: scratch in memory (macOS)
        if: runner.os == 'macOS'
        run: |
          dev=$(hdiutil attach -nomount ram://$((2048 * 2048)) | awk '{print $1}')
          diskutil erasevolume APFS rlmdb-scratch "$dev"
          echo "RLMDB_TEST_SCRATCH=/Volumes/rlmdb-scratch" >> "$GITHUB_ENV"
      - name: test (${{ matrix.scope }} suite)
        run: cargo test --workspace --no-fail-fast
        env:
          RLMDB_TEST_SCOPE: ${{ matrix.scope }}

  bsd-check:
    # Checks that the workspace, its tests included, compiles for FreeBSD,
    # NetBSD and Android. The runner has no sysroot of theirs for the C
    # reference library, so the interop and bench build scripts skip it
    # (RLMDB_SKIP_C_BUILD, see interop/build.rs). bsd.yml runs the tests in
    # a FreeBSD VM weekly, nightly.yml in a Termux container (Android).
    name: Check BSD and Android targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RLMDB_SKIP_C_BUILD: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd,x86_64-unknown-netbsd,x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: check FreeBSD
        run: cargo check --workspace --target x86_64-unknown-freebsd
      - name: check NetBSD
        run: cargo check --workspace --target x86_64-unknown-netbsd
      - name: clippy FreeBSD
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-freebsd -- -D warnings
      - name: clippy NetBSD
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-netbsd -- -D warnings
      - name: clippy Android
        run: cargo clippy --workspace --all-targets --target x86_64-linux-android -- -D warnings
