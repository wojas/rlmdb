# Formatting, lints, rustdoc and the tests on every push and pull request,
# on the three platforms rlmdb is tested on. The tests build the C
# reference library from tests/lmdb-c with the runner's C compiler; no git
# history or network access is needed after the checkout.
#
# Linux x86-64 runs the whole test suite. Linux arm64 and macOS run the
# platform suite (RLMDB_TEST_SCOPE=platform, see interop/README.md): what
# depends on the platform (unit and format tests, the lock file, readers
# and concurrency, the C API, tools and install tests, the differential
# tests at the OS page size, the reader and lock-file scenarios of the
# interop matrix and a smoke set of the others); the rest of the matrix,
# the other page sizes, the mutation and model tests are SKIPPED there.
# nightly.yml runs the whole suite on every platform.
#
# RLMDB_DEFAULT_FORMAT is deliberately not set: the tests assume it is unset
# (see scripts/check-all.sh).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            scope: full
          - name: Linux arm64
            os: ubuntu-24.04-arm
            scope: platform
          - name: macOS arm64
            os: macos-latest
            scope: platform
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: test (${{ matrix.scope }} suite)
        run: cargo test --workspace --no-fail-fast
        env:
          RLMDB_TEST_SCOPE: ${{ matrix.scope }}

  bsd-check:
    # FreeBSD and NetBSD are supported but untested (COMPATIBILITY.md):
    # this only checks that the workspace, its tests included, compiles for
    # them. The runner has no BSD sysroot for the C reference library, so
    # the interop and bench build scripts skip it (RLMDB_SKIP_C_BUILD, see
    # interop/build.rs). bsd.yml runs the tests in a FreeBSD VM.
    name: Check BSD targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RLMDB_SKIP_C_BUILD: 1
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd,x86_64-unknown-netbsd
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: check FreeBSD
        run: cargo check --workspace --target x86_64-unknown-freebsd
      - name: check NetBSD
        run: cargo check --workspace --target x86_64-unknown-netbsd
      - name: clippy FreeBSD
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-freebsd -- -D warnings
      - name: clippy NetBSD
        run: cargo clippy --workspace --all-targets --target x86_64-unknown-netbsd -- -D warnings
