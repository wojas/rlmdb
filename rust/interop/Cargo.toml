[package]
name = "rlmdb-interop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Cross-process compatibility test bed: C LMDB and Rust LMDB processes sharing one environment"

[lib]
name = "interop"

# The Rust peer: the command protocol of README.md on `rlmdb::core`.
[[bin]]
name = "rpeer"
path = "src/bin/rpeer/main.rs"

# The Rust tools of `rlmdb-tools` in one executable (`rtools mdb_stat ...`),
# so that tests can run them next to the C 1.0 tools built here.
[[bin]]
name = "rtools"
path = "src/bin/rtools.rs"

[dependencies]
rlmdb = { path = "../rlmdb" }
rlmdb-tools = { path = "../rlmdb-tools" }
tempfile = "3"

[dev-dependencies]
# tests/layout.rs compares C's sizeof(pthread_mutex_t) etc. with the types
# the Rust library is compiled against.
libc.workspace = true
# Not used as a Rust crate: depending on it makes cargo build its
# `liblmdb.a` (the lib has an rlib crate type, so all crate types are built
# before the tests), which the third peer, `Peer::COnRust` (cpeer linked
# against the Rust library), is linked with at test time.
rlmdb-capi = { path = "../rlmdb-capi" }

[build-dependencies]
cc = "1"
