[workspace]
resolver = "2"
members = [
    "rlmdb",
    "rlmdb-capi",
    "rlmdb-tools",
    "interop",
    "bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "OLDAP-2.8"
repository = "https://github.com/wojas/rlmdb"

[workspace.dependencies]
libc = "0.2"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
