[package]
name = "interop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Cross-process compatibility test bed: C LMDB and Rust LMDB processes sharing one environment"

# The Rust peer: the command protocol of README.md on `lmdb::core`.
[[bin]]
name = "rpeer"
path = "src/bin/rpeer/main.rs"

[dependencies]
lmdb-core = { path = "../lmdb-core" }
tempfile = "3"

[dev-dependencies]
# tests/layout.rs compares C's sizeof(pthread_mutex_t) etc. with the types
# the Rust library is compiled against.
libc.workspace = true
# Not used as a Rust crate: depending on it makes cargo build its
# `liblmdb.a` (the lib has an rlib crate type, so all crate types are built
# before the tests), which the third peer, `Peer::COnRust` (cpeer linked
# against the Rust library), is linked with at test time.
lmdb-capi = { path = "../lmdb-capi" }

[build-dependencies]
cc = "1"
