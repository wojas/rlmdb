[package]
name = "rlmdb-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "rlmdb_stat, rlmdb_dump, rlmdb_load, rlmdb_copy, rlmdb_drop: the LMDB tools in Rust"
publish = false

[lib]
name = "rlmdb_tools"
path = "src/lib.rs"

[[bin]]
name = "rlmdb_stat"
path = "src/bin/rlmdb_stat.rs"

[[bin]]
name = "rlmdb_dump"
path = "src/bin/rlmdb_dump.rs"

[[bin]]
name = "rlmdb_load"
path = "src/bin/rlmdb_load.rs"

[[bin]]
name = "rlmdb_copy"
path = "src/bin/rlmdb_copy.rs"

[[bin]]
name = "rlmdb_drop"
path = "src/bin/rlmdb_drop.rs"

[dependencies]
rlmdb = { path = "../rlmdb" }

[dev-dependencies]
# The tests build the C tools from tests/lmdb-c/0.9 at test time.
cc = "1"
# flock() for the lock that serialises that build across test binaries.
libc.workspace = true
tempfile = "3"
